<style>
  :root{
    --red:#B22C3E;
    --red-dark:#8C1F2E;
    --red-deep:#3A0816;
    --gold:#C8A35B;
    --gold-soft:#E7D6B0;
    --bg:#FBF8F3;
    --ink:#2A2326;
    --ink-2:#6B6168;
    --ink-3:#9A8F92;
    --card:#FFFFFF;
    --line:#ECE4DA;
    --shadow:0 1px 3px rgba(0,0,0,.05),0 10px 30px rgba(138,44,62,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  /* ===== HERO ===== */
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg, var(--red-deep) 0%, var(--red) 50%, var(--red-deep) 100%);
    color:#fff;padding:60px 20px 54px;text-align:center;
  }
  .hero .kicker{font-size:12px;letter-spacing:5px;opacity:.85;margin-bottom:14px;}
  .hero h1{font-size:30px;line-height:1.3;margin:0 0 10px;font-weight:800;letter-spacing:2px;}
  .hero .sub{font-size:15px;opacity:.92;max-width:560px;margin:0 auto;}
  .hero .span{margin-top:16px;font-size:12px;opacity:.78;}

  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
    max-width:680px;margin:30px auto 0;position:relative;z-index:2;
  }
  .stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:16px 6px;backdrop-filter:blur(2px);}
  .stat .num{font-size:26px;font-weight:800;line-height:1.1;color:#fff;}
  .stat .lab{font-size:12px;opacity:.85;margin-top:4px;}

  /* ===== TIMELINE ===== */
  .tl-wrap{max-width:900px;margin:0 auto;padding:42px 16px 30px;}
  .tl-intro{text-align:left;max-width:900px;margin:10px auto 24px;padding:0 18px;color:var(--ink-2);font-size:14px;line-height:1.95;}
  .tl-intro b{color:var(--red);}

  .tl{position:relative;padding:6px 0 6px;}
  .tl::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:linear-gradient(var(--gold),var(--gold-soft));}
  .tl::after{content:"";position:absolute;left:26px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(178,44,62,.18);}
  .tl-fill{position:absolute;left:29px;top:0;width:4px;border-radius:2px;background:linear-gradient(var(--gold),var(--red));transform-origin:top center;transform:scaleY(0);z-index:1;}

  .tl-year{position:relative;padding-left:64px;margin:8px 0 16px;}
  .tl-year-dot{
    position:absolute;left:14px;top:-2px;width:34px;height:34px;border-radius:50%;
    background:var(--red);color:#fff;font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 5px var(--bg),0 4px 10px rgba(138,44,62,.3);z-index:3;
  }

  .tl-block{position:relative;padding-left:64px;margin-bottom:30px;}
  .tl-node{
    position:absolute;left:23px;top:26px;width:16px;height:16px;border-radius:50%;
    background:var(--red);border:3px solid #fff;box-shadow:0 0 0 3px var(--gold);z-index:2;
  }

  .tl-card{
    position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
  }
  .tl-cover{height:188px;background-size:cover;background-position:center;background-color:#f0e7da;position:relative;}
  .tl-cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:54px;background:linear-gradient(transparent,rgba(0,0,0,.28));}
  .tl-cover--ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    background:linear-gradient(135deg,var(--red),var(--red-dark));}
  .tl-cover--ph .ph-big{font-size:18px;font-weight:800;color:#fff;letter-spacing:1px;}
  .tl-cover--ph .ph-sub{font-size:12px;color:rgba(255,255,255,.82);}

  .tl-body{padding:16px 18px 18px;}
  .tl-month{font-size:18px;font-weight:800;color:var(--red-dark);}
  .tl-month-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px;}
  .tl-title{font-size:13.5px;color:var(--ink-2);margin-top:2px;margin-bottom:10px;}
  .tl-meta{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--ink-3);margin-bottom:12px;}
  .tl-link-wrap{margin-left:auto;}
  .tl-link{color:var(--red);border:1px solid var(--red);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
  .tl-link .arw{border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid var(--red);display:inline-block;}

  .acts{border-top:1px dashed var(--line);}
  /* ===== 折叠：默认收起每月具体条目 ===== */
  .tl-block:not(.open) .acts{display:none;}
  .tl-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .tl-toggle{
    flex:0 0 auto;cursor:pointer;background:#fff;border:1px solid var(--red);
    color:var(--red);border-radius:8px;padding:3px 11px;font-size:12px;font-weight:600;
    white-space:nowrap;font-family:inherit;transition:background .15s ease,color .15s ease;
  }
  .tl-toggle:hover{background:var(--red);color:#fff;}
  .tl-toggle .arw{font-size:10px;}
  .act{display:flex;gap:10px;padding:11px 0;border-top:1px dashed var(--line);}
  .act:first-child{border-top:0;}
  .act-day{flex:0 0 48px;font-size:11px;font-weight:700;color:var(--red);padding-top:2px;line-height:1.3;}
  .act-main{flex:1;min-width:0;}
  .act-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.45;}
  .act-title.other{font-style:italic;color:var(--ink-2);}
  .act-desc{font-size:12.5px;color:var(--ink-2);margin-top:3px;}
  .act-chips{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
  .loc{font-size:11px;color:var(--ink-2);background:#F4F0EA;padding:3px 10px;border-radius:9px;line-height:1.5;}
  .org{font-size:11px;color:#8a5a00;background:#FDF3E0;padding:3px 10px;border-radius:9px;line-height:1.5;}

  .foot{max-width:900px;margin:0 auto;padding:24px 18px 56px;color:var(--ink-3);font-size:12px;text-align:center;line-height:1.9;}
  .foot .logo{width:58px;height:58px;border-radius:50%;margin:0 auto 14px;display:block;object-fit:cover;background:#fff;}

  /* ===== 筛选 / 搜索 ===== */
  .tl-controls{max-width:900px;margin:24px auto 8px;padding:0 18px;}
  .tl-pills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:68px;height:38px;padding:0 18px;border:none;border-radius:999px;width:100%;
    background:#F1F1F1;color:#555;
    font:600 14px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    cursor:pointer;transition:background .15s ease,color .15s ease,box-shadow .15s ease;
  }
  .pill:hover{background:#E6E6E6;}
  .pill.active{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(178,44,62,.28);}
  .tl-search{position:relative;}
  .tl-search .srch-icon{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:#999;pointer-events:none;
  }
  .tl-search input{
    width:100%;height:46px;padding:0 16px 0 44px;border:1px solid transparent;border-radius:14px;
    background:#F4F4F4;color:#222;outline:none;
    font:400 14px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;
  }
  .tl-search input::placeholder{color:#B0B0B0;}
  .tl-search input:focus{background:#fff;border-color:var(--red);box-shadow:0 0 0 3px rgba(178,44,62,.12);}
  .tl-search-row{display:flex;gap:10px;align-items:center;margin-top:12px;}
  .tl-search-row .tl-search{flex:1 1 auto;min-width:0;}
  .tl-expandall{
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    min-width:68px;height:38px;padding:0 18px;border:none;border-radius:999px;
    background:#F1F1F1;color:#555;white-space:nowrap;
    font:600 14px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    cursor:pointer;transition:background .15s ease,color .15s ease,box-shadow .15s ease;
  }
  .tl-expandall:hover{background:#E6E6E6;}
  .tl-empty{
    max-width:680px;margin:48px auto;text-align:center;color:var(--ink-3);
    font-size:14px;padding:24px;border-radius:14px;background:#FAF7F2;
    line-height:1.7;
  }
  .tl-empty b{color:var(--red);font-weight:700;}

  /* ===== 精彩继续 ===== */
  .tl-continue{max-width:680px;margin:34px auto 4px;padding:0 18px 20px;text-align:center;}
  .tl-continue .ct-line{height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:14px 0;}
  .tl-continue .ct-kicker{font-size:11px;letter-spacing:4px;color:var(--gold);font-weight:700;}
  .tl-continue .ct-main{font-size:16px;font-weight:800;color:var(--red);margin-top:8px;letter-spacing:1px;}

  /* ===== responsive ===== */
  @media (max-width:560px){
    .hero h1{font-size:24px;}
    .stats{grid-template-columns:repeat(2,1fr);gap:10px;}
    .tl-block,.tl-year{padding-left:48px;}
    .tl::before{left:22px;}
    .tl-fill{left:21px;}
    .tl-node{left:15px;}
    .tl-year-dot{left:6px;}
    .tl-cover{height:160px;}
  }
  @media (prefers-reduced-motion:reduce){
    .tl-fill{transform:scaleY(1)!important;}
  }
</style>

      {day:"7.10", title:"百校千企联盟首届理事会", place:"苏州", org:"苏州中心", desc:"苏州“百校千企”联盟第一届会员代表大会暨首届理事会召开，60所高校64家企业近170位代表参会，理大副校长郑子剑出席。"},
      {day:"7.16", title:"中科星图空天大会", place:"无锡", org:"低空经济分会", desc:"7月16日至17日，2026空天信息大会暨中科星图生态合伙人大会在无锡举办，赵江伟副会长一行受邀参会，共探低空经济前沿趋势。"},
      {day:"7.22", title:"羽毛球运动", place:"苏州", org:"酥梨羽社", desc:"携手中科大江苏校友会在园区羽毛球馆举办友谊赛，以球会友深化两校校友联谊。"},
      {day:"7.23", title:"中国信通院合作研讨", place:"苏州", org:"人工智能分会", desc:"人工智能分会与中国信通院云大所举行合作研讨，围绕“DGS可信数字员工工厂”落地场景与OPC对接路径交流。"},
      {day:"7.25", title:"北大光华思享会", place:"南京", org:"南京中心", desc:"“光华智行·破局向新”北大光华南京思享会暨“服务民企365·新宁商大讲坛”第36期，校友会作为协办单位助力。"},
      {day:"8.12", title:"WorkBuddy智能体培训", place:"苏州", org:"酒旅分会", desc:"WorkBuddy企业版线下宣讲会校友会专属活动在苏州南园宾馆举办，联合南园宾馆、腾讯、奥莱维共同组织，聚焦智能体落地实操。"},
      {day:"8.14", title:"盛派研究院多智能体工作坊", place:"苏州", org:"人工智能分会", desc:"人工智能分会联合盛派研究院在苏州举办AI多智能体专题工作坊，含系统介绍、案例讲解与动手实操。"},
      {day:"8.20", title:"AI 定制服装平台对接投资人", place:"杭州", org:"对外发展部", desc:"组织无锡研究院「面向定制服装的人工智能协同平台」与投资人专场洽谈，推动项目落地与资本对接。"},
    ]
  },
];
</script>
<script src="assets/gsap.min.js"></script>
<script src="assets/ScrollTrigger.min.js"></script>
<script>
(function(){
  const REVIEWS = window.REVIEWS || [];
  const totalItems = REVIEWS.reduce((s,r)=>s+(r.items?r.items.length:0),0);
  // 日期范围（首块~末块 publish 实时推导）
  const ymOf = d => { const [y,mo] = String(d).split("-").map(Number); return {y,mo}; };
  const fmtYM = d => d.y + "." + String(d.mo).padStart(2,"0");
  const first = ymOf(REVIEWS[0].publish), last = ymOf(REVIEWS[REVIEWS.length-1].publish);
  const spanMonths = (last.y - first.y) * 12 + (last.mo - first.mo) + 1;
  // 覆盖城市（从 items.place 实时统计，归一化叶子城市，排除非城市词）
  const NONCITY = /^(直播|线上|线下|待定|多地|全体|江苏|浙江|广东|北京|上海|天津|重庆|香港|澳门|台湾)$/;
  const citySet = new Set();
  REVIEWS.forEach(r => (r.items||[]).forEach(it => {
    String(it.place||"").split(/[·、/,，  ]/).forEach(t => { t=t.trim(); if(t && !NONCITY.test(t)) citySet.add(t); });
  }));
  const cityList = [...citySet].filter(a => ![...citySet].some(b => b!==a && a.endsWith(b) && a.length>b.length));
  const cityCount = cityList.length;
  // 回填顶部动态数字
  const dr = document.getElementById("dateRange"); if(dr) dr.textContent = fmtYM(first) + " — " + fmtYM(last);
  const ms = document.getElementById("mSpan"); if(ms) ms.textContent = spanMonths;
  const as = document.getElementById("aSpan"); if(as) as.textContent = totalItems;
  const stats = [
    {num:fmtYM(first), lab:"成立时间", count:false},
    {num:REVIEWS.length, lab:"月度回顾", count:true},
    {num:totalItems, lab:"活动场次", count:true},
    {num:cityCount, lab:"覆盖城市", count:true},
  ];
  document.getElementById("stats").innerHTML = stats.map(s=>
    `<div class="stat"><div class="num" data-num="${s.count?s.num:''}">${s.num}</div><div class="lab">${s.lab}</div></div>`
  ).join("");

  const tl = document.getElementById("tl");
  const coverOf = (r, i) => {
    if (i === 0) return "assets/covers/0.jpg";   // 成立大会（用户提供，勿改）
    if (!r.link) return null;                     // 最新一期 link:null → 红色占位
    return "assets/covers/" + i + ".jpg";         // 其余按索引取图，缺图自动 onerror 回退
  };

  let curYear = null, lastYearBlock = false;
  REVIEWS.forEach((r, i)=>{
    if(r.year !== curYear){
      curYear = r.year;
      const y = document.createElement("div");
      y.className = "tl-year";
      y.innerHTML = `<span class="tl-year-dot">${curYear}</span>`;
      tl.appendChild(y);
    }
    const block = document.createElement("div");
    block.className = "tl-block open";
    block.dataset.year = r.year;
    const cover = coverOf(r, i);
    const coverHtml = cover
      ? `<div class="tl-cover" style="background-image:url('${cover}')"></div>`
      : `<div class="tl-cover tl-cover--ph"><div class="ph-big">最新回顾</div><div class="ph-sub">原文即将发布</div></div>`;
    const linkHtml = r.link
      ? `<a class="tl-link" href="${r.link}" target="_blank" rel="noopener">原文<span class="arw"></span></a>` : "";
    const acts = (r.items||[]).map(it=>{
      const orgChip = it.org ? `<span class="org">${it.org}</span>` : "";
      const tcls = it.other ? "act-title other" : "act-title";
      const srch = [it.title, it.place, it.org, it.desc, it.day, r.monthLabel, r.title].join(" ").toLowerCase();
      return `<div class="act" data-srch="${srch.replace(/"/g,'&quot;')}">
        <div class="act-day">${it.day}</div>
        <div class="act-main">
          <div class="${tcls}">${it.title}</div>
          <div class="act-desc">${it.desc}</div>
          <div class="act-chips"><span class="loc">📍 ${it.place}</span>${orgChip}</div>
        </div></div>`;
    }).join("");
    block.innerHTML = `
      <span class="tl-node"></span>
      <div class="tl-card">
        ${coverHtml}
        <div class="tl-body">
          <div class="tl-month-row"><div class="tl-month">${r.monthLabel}</div><span class="tl-link-wrap">${linkHtml}</span></div>
          <div class="tl-title-row"><div class="tl-title">${r.title}</div><button class="tl-toggle" type="button" data-cnt="${r.items?r.items.length:0}">展开 (${r.items?r.items.length:0}) <span class="arw">▾</span></button></div>
          <div class="tl-meta"><span>发布：${r.publish||'—'}</span></div>
          <div class="acts">${acts}</div>
        </div>
      </div>`;
    tl.appendChild(block);
  });

  /* ===== 每月条目折叠 / 展开 ===== */
  function updateExpandAllLabel(){
    const btn = document.getElementById("expandAll");
    if(!btn) return;
    const blocks = Array.from(document.querySelectorAll(".tl-block"));
    const allOpen = blocks.length>0 && blocks.every(b=>b.classList.contains("open"));
    btn.innerHTML = allOpen ? `收起明细 ▴` : `展开明细 ▾`;
  }
  document.querySelectorAll(".tl-block").forEach(b=>{
    const btn = b.querySelector(".tl-toggle");
    if(!btn) return;
    const sync = ()=>{
      const open = b.classList.contains("open");
      const cnt = btn.dataset.cnt || "0";
      btn.innerHTML = open ? `收起 <span class="arw">▴</span>` : `展开 (${cnt}) <span class="arw">▾</span>`;
    };
    sync();
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      b.classList.toggle("open");
      sync();
      updateExpandAllLabel();
      if(window.ScrollTrigger && window.ScrollTrigger.refresh) window.ScrollTrigger.refresh();
    });
  });
  updateExpandAllLabel();

  /* ===== 展开明细 / 收起明细 ===== */
  const expandAllBtn = document.getElementById("expandAll");
  if(expandAllBtn){
    expandAllBtn.addEventListener("click", ()=>{
      const blocks = Array.from(document.querySelectorAll(".tl-block"));
      const allOpen = blocks.length>0 && blocks.every(b=>b.classList.contains("open"));
      const target = !allOpen;
      blocks.forEach(b=>b.classList.toggle("open", target));
      document.querySelectorAll(".tl-toggle").forEach(btn=>{
        const b = btn.closest(".tl-block");
        if(!b) return;
        const open = b.classList.contains("open");
        const cnt = btn.dataset.cnt || "0";
        btn.innerHTML = open ? `收起 <span class="arw">▴</span>` : `展开 (${cnt}) <span class="arw">▾</span>`;
      });
      updateExpandAllLabel();
      if(window.ScrollTrigger && window.ScrollTrigger.refresh) window.ScrollTrigger.refresh();
    });
  }

  /* ===== 封面图加载失败 -> 回退红渐变占位 ===== */
  document.querySelectorAll(".tl-cover").forEach(c=>{
    const m = /url\('([^']+)'\)/.exec(c.getAttribute("style") || "");
    if(!m) return;
    const img = new Image();
    img.onerror = ()=>{
      c.classList.add("tl-cover--ph");
      c.style.backgroundImage = "none";
      if(!c.querySelector(".ph-big")){
        c.innerHTML = '<div class="ph-big">活动回顾</div><div class="ph-sub">封面即将上线</div>';
      }
    };
    img.src = m[1];
  });

  /* ===== 筛选 / 搜索 ===== */
  const pillBtns = document.querySelectorAll("#yearPills .pill");
  const searchInput = document.getElementById("searchInput");
  let selYear = "all", curQuery = "";

  function applyFilter(){
    const q = curQuery.trim().toLowerCase();
    const yearVisible = new Set();
    let totalVisible = 0;

    document.querySelectorAll(".tl-block").forEach(block=>{
      const blockYear = block.dataset.year;
      const yearMatch = selYear === "all" || selYear === blockYear;
      let blockHasMatch = false;

      block.querySelectorAll(".act").forEach(act=>{
        const srch = act.dataset.srch || "";
        const textMatch = !q || srch.includes(q);
        const show = yearMatch && textMatch;
        if(show){
          act.style.display = "";
          blockHasMatch = true;
          totalVisible++;
          if(window.gsap){
            const card = act.closest(".tl-card");
            if(card) gsap.set(card, {opacity:1, y:0, clearProps:"transform"});
          }
        } else {
          act.style.display = "none";
        }
      });

      if(yearMatch && blockHasMatch){
        block.style.display = "";
        yearVisible.add(blockYear);
        if(window.gsap){
          const card = block.querySelector(".tl-card");
          if(card) gsap.set(card, {opacity:1, y:0, clearProps:"transform"});
        }
      } else {
        block.style.display = "none";
      }
    });

    document.querySelectorAll(".tl-year").forEach(yd=>{
      const yr = yd.querySelector(".tl-year-dot").textContent;
      yd.style.display = (selYear === "all" || yearVisible.has(yr)) ? "" : "none";
    });

    let empty = document.getElementById("tlEmpty");
    if(totalVisible === 0){
      if(!empty){
        empty = document.createElement("div");
        empty.id = "tlEmpty";
        empty.className = "tl-empty";
        const tlSection = document.getElementById("tl");
        if(tlSection) tlSection.insertBefore(empty, tlSection.firstChild);
        else document.querySelector(".tl-wrap").appendChild(empty);
      }
      const yearTxt = selYear === "all" ? "" : ` · <b>${selYear}</b> 年`;
      const qTxt = q ? ` · 关键词 <b>${q}</b>` : "";
      empty.innerHTML = `没有匹配的活动${yearTxt}${qTxt}，试试别的关键词或年份`;
      empty.style.display = "";
    } else if(empty){
      empty.style.display = "none";
    }

    if(window.ScrollTrigger) window.ScrollTrigger.refresh();
  }

  pillBtns.forEach(p=>{
    p.addEventListener("click", ()=>{
      pillBtns.forEach(x=>x.classList.remove("active"));
      p.classList.add("active");
      selYear = p.dataset.year;
      applyFilter();
    });
  });
  searchInput.addEventListener("input", ()=>{
    curQuery = searchInput.value;
    applyFilter();
  });

  /* ===== Animations (GSAP) ===== */
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(window.gsap && !reduce){
    const { gsap } = window;
    if(window.ScrollTrigger) gsap.registerPlugin(window.ScrollTrigger);

    // hero entrance
    gsap.from(".hero .kicker, .hero h1, .hero .sub, .hero .span", {y:24, opacity:0, duration:.7, stagger:.12, ease:"power2.out"});
    gsap.from(".stat", {y:20, opacity:0, duration:.6, stagger:.1, delay:.2, ease:"back.out(1.6)"});

    // count up
    document.querySelectorAll(".stat .num[data-num]").forEach(el=>{
      const target = +el.dataset.num;
      if(!target) return;
      const obj = {v:0};
      gsap.to(obj, {v:target, duration:1.4, delay:.4, ease:"power1.out",
        onUpdate:()=>{ el.textContent = Math.round(obj.v); }});
    });

    // axis fill on scroll
    if(window.ScrollTrigger){
      gsap.to("#tlFill", {
        scaleY:1, ease:"none",
        scrollTrigger:{ trigger:"#tl", start:"top 70%", end:"bottom 80%", scrub:0.6 }
      });
      // cards reveal
      gsap.utils.toArray(".tl-block").forEach(b=>{
        gsap.from(b.querySelector(".tl-card"), {
          y:46, opacity:0, duration:.7, ease:"power2.out",
          scrollTrigger:{ trigger:b, start:"top 88%" }
        });
        gsap.from(b.querySelector(".tl-node"), {
          scale:0, duration:.5, ease:"back.out(2)",
          scrollTrigger:{ trigger:b, start:"top 88%" }
        });
      });
      // year dots bounce
      gsap.utils.toArray(".tl-year").forEach(y=>{
        gsap.from(y.querySelector(".tl-year-dot"), {
          scale:0, duration:.6, ease:"back.out(2.2)",
          scrollTrigger:{ trigger:y, start:"top 85%" }
        });
      });
    }
  } else {
    document.getElementById("tlFill").style.transform = "scaleY(1)";
  }
})();
</script>
</body>
</html>
